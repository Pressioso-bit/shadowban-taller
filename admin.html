<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADOWBAN · Admin</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: single-column mobile-first, max-width 540px centered, card-based UI */
:root {
  --bg: #F6EFE3;
  --card: #FFFAF1;
  --ink: #241A17;
  --dim: #6B5D55;
  --coral: #DE5D48;
  --coral-soft: #e8866e;
  --turq: #58E4BF;
  --turq-dim: #3aab8e;
  --navy: #0F1830;
  --ochre: #B9801C;
  --ok: #2F8F5B;
  --bad: #B3392B;
  --line: #E3D6C3;
  --display: 'Bricolage Grotesque', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150F0D; --card: #231A17; --ink: #F1E8D9; --dim: #B8A99A;
    --coral: #E0714B; --coral-soft: #c45733; --turq: #58E4BF; --turq-dim: #3aab8e;
    --navy: #0A0F1E; --ochre: #E0A33D; --ok: #5FCF93; --bad: #FF7A68;
    --line: #3A2B26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150F0D; --card: #231A17; --ink: #F1E8D9; --dim: #B8A99A;
  --coral: #E0714B; --coral-soft: #c45733; --turq: #58E4BF; --turq-dim: #3aab8e;
  --navy: #0A0F1E; --ochre: #E0A33D; --ok: #5FCF93; --bad: #FF7A68;
  --line: #3A2B26; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); line-height: 1.5;
  padding-inline: 16px;
}
main {
  max-width: 540px; margin: 0 auto;
  padding-block: 24px 48px;
}

/* ── Shared elements ── */
.eyebrow {
  color: var(--ochre); font-size: .72rem; letter-spacing: .14em;
  font-weight: 700; text-transform: uppercase; margin-bottom: 4px;
}
h1 {
  font-family: var(--display); font-weight: 800;
  font-size: 2.4rem; letter-spacing: -.02em; margin: 0 0 4px;
}
.sub {
  font-style: italic; color: var(--coral); margin: 0 0 24px;
  font-size: 1.05rem;
}
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 24px; margin-bottom: 16px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 14px 28px; border: 0; border-radius: 14px;
  background: var(--coral); color: #fff;
  font-family: var(--body); font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: opacity .15s;
}
.btn:hover:not(:disabled) { opacity: .85 }
.btn:disabled { opacity: .5; cursor: not-allowed }
.btn.ghost {
  background: transparent; color: var(--ink);
  border: 1.5px solid var(--line);
}
.btn.turq { background: var(--turq); color: var(--navy) }
.btn.navy { background: var(--navy); color: #fff }
.btn.sm { padding: 10px 18px; font-size: .9rem; border-radius: 12px }
input[type="text"], input[type="password"] {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--line);
  border-radius: 12px; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 1rem; box-sizing: border-box;
}
input:focus { outline: 2px solid var(--coral); border-color: var(--coral) }

.foot {
  margin-top: 32px; text-align: center; font-style: italic;
  color: var(--dim); font-size: .88rem;
}

/* ── Activity cards ── */
.act-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 18px; padding: 28px; cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.act-card:hover:not(.locked) { border-color: var(--coral); transform: translateY(-2px) }
.act-card.locked { opacity: .55; cursor: not-allowed }
.act-card .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--coral); color: #fff;
  font-family: var(--display); font-weight: 800; font-size: .9rem;
}
.act-card.locked .num { background: var(--dim) }
.act-card h3 {
  font-family: var(--display); font-weight: 700;
  font-size: 1.3rem; margin: 10px 0 6px;
}
.act-card p { color: var(--dim); margin: 0; font-size: .95rem }
.act-card .lock-badge {
  display: inline-block; margin-top: 10px; padding: 4px 12px;
  border-radius: 8px; background: var(--line); color: var(--dim);
  font-size: .8rem; font-weight: 700;
}

/* ── Trivia ── */
.tabs { display: flex; gap: 8px; margin-bottom: 16px }
.tabs button {
  flex: 1; padding: 10px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); border-radius: 12px;
  font-family: var(--body); font-weight: 600; cursor: pointer;
}
.tabs button.on { background: var(--coral); border-color: var(--coral); color: #fff }
.meta { color: var(--dim); font-size: .85rem; margin-bottom: 8px }
.q { font-size: 1.15rem; font-weight: 600; margin: 0 0 14px }
.opt {
  display: block; width: 100%; text-align: left; margin: 8px 0;
  padding: 12px 14px; border: 1.5px solid var(--line);
  background: transparent; color: var(--ink); border-radius: 12px;
  font-family: var(--body); font-size: 1rem; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--coral) }
.opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent) }
.opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent) }
.exp {
  margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--ochre);
  background: color-mix(in srgb, var(--ochre) 10%, transparent);
  border-radius: 6px; font-size: .95rem;
}
.hint {
  color: var(--dim); font-size: .9rem; cursor: pointer;
  text-decoration: underline; margin-top: 6px; display: inline-block;
}
.row { display: flex; gap: 8px; margin-top: 16px; justify-content: space-between }
.flip {
  min-height: 220px; display: flex; flex-direction: column;
  justify-content: center; cursor: pointer; text-align: center;
}
.flip .lab {
  color: var(--ochre); font-size: .72rem; letter-spacing: .14em;
  font-weight: 600; text-transform: uppercase; margin-bottom: 10px;
}
.flip .big { font-size: 1.2rem; font-weight: 600 }
.flip .small { margin-top: 12px; color: var(--dim); font-size: .95rem }
.score { font-size: 3rem; font-weight: 700; color: var(--coral); margin: .2rem 0 }

/* ── Upload zone ── */
.upload-zone {
  border: 2px dashed var(--line); border-radius: 18px;
  padding: 40px 20px; text-align: center; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--turq); background: color-mix(in srgb, var(--turq) 8%, transparent) }
.upload-zone svg { margin-bottom: 12px }
.upload-zone p { margin: 0; color: var(--dim) }
.preview-img {
  width: 100%; max-height: 400px; object-fit: contain;
  border-radius: 12px; margin-top: 16px;
}
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px }
.gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--line) }

/* ── Admin ── */
.stat-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap }
.stat {
  flex: 1; min-width: 120px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; text-align: center;
}
.stat .n { font-family: var(--display); font-size: 2rem; font-weight: 800; color: var(--coral) }
.stat .l { font-size: .82rem; color: var(--dim); margin-top: 2px }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.toggle-row:last-child { border-bottom: 0 }
.toggle {
  position: relative; width: 52px; height: 28px; cursor: pointer;
}
.toggle input { position: absolute; opacity: 0; width: 0; height: 0 }
.toggle .slider {
  position: absolute; inset: 0; background: var(--line); border-radius: 14px;
  transition: background .2s;
}
.toggle .slider::after {
  content: ''; position: absolute; left: 3px; top: 3px;
  width: 22px; height: 22px; background: #fff; border-radius: 50%;
  transition: transform .2s;
}
.toggle input:checked + .slider { background: var(--ok) }
.toggle input:checked + .slider::after { transform: translateX(24px) }

.p-list { list-style: none; padding: 0; margin: 0 }
.p-list li {
  padding: 10px 0; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  font-size: .95rem;
}
.p-list li:last-child { border-bottom: 0 }
.p-list .time { color: var(--dim); font-size: .82rem }

/* ── Config notice ── */
.config-warn {
  background: color-mix(in srgb, var(--ochre) 14%, transparent);
  border: 1.5px solid var(--ochre); border-radius: 14px;
  padding: 20px; margin-bottom: 20px; font-size: .95rem;
}
.config-warn strong { color: var(--ochre) }

/* ── Back nav ── */
.back {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--dim); font-size: .9rem; cursor: pointer;
  background: none; border: 0; font-family: var(--body);
  padding: 0; margin-bottom: 16px;
}
.back:hover { color: var(--ink) }

/* ── Progress dots ── */
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px }
.dots span {
  width: 8px; height: 8px; border-radius: 50%; background: var(--line);
}
.dots span.on { background: var(--coral) }

/* ── Spinner ── */
.spin {
  display: inline-block; width: 20px; height: 20px;
  border: 2.5px solid rgba(255,255,255,.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* ── Photo card overlay ── */
.photo-card {
  position: relative; border-radius: 12px; overflow: hidden;
}
.photo-card img { display: block }
.photo-card .name-tag {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 12px; background: linear-gradient(transparent, rgba(0,0,0,.7));
  color: #fff; font-size: .82rem; font-weight: 700;
}
.logo { display:block; width:140px; height:auto; margin:0 auto 14px; border-radius:20px; background:#fff }
.eyebrow, h1, .sub { text-align:center }

select.fld, input[type="date"].fld, textarea.fld { width:100%; box-sizing:border-box; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:1rem; margin-bottom:12px }
label.lb { display:block; font-size:.85rem; font-weight:700; color:var(--dim); margin-bottom:4px }
[hidden] { display: none !important }
.btn.danger { background: var(--bad); color: #fff }
.photo-card .x { position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; border:0; background:rgba(0,0,0,.65); color:#fff; font-size:.85rem; cursor:pointer; line-height:1 }
.photo-card .x:hover { background: var(--bad) }
</style>
</head>
<body>

<main id="app"></main>

<script src="config.js"></script>
<script>
const ADMIN_PASSWORD = "alma2026"; // cambia aquí la contraseña del panel
// ═══════════════════════════════════════════════════════════════
//  Firebase SDK loader (carga desde CDN de Google)
// ═══════════════════════════════════════════════════════════════
let fb = null, fdb = null;
let firebaseReady = false;
let firebaseError = "";

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initFirebase() {
  if (!CONFIG.firebase.apiKey) { firebaseError = "config.js no tiene las credenciales de Firebase (apiKey vacío)."; return false; }
  try {
    const V = "10.12.0";
    const CDN = "https://www.gstatic.com/firebasejs/" + V;
    // Load app first, then firestore + storage in parallel
    await loadScript(CDN + "/firebase-app-compat.js");
    await loadScript(CDN + "/firebase-firestore-compat.js");
    fb = firebase.initializeApp(CONFIG.firebase);
    fdb = firebase.firestore();
    firebaseReady = true;
    return true;
  } catch (e) {
    console.error("Firebase init error:", e);
    firebaseError = "No se pudieron cargar los scripts de Firebase (revisa tu conexión a internet o si algún bloqueador los impide).";
    return false;
  }
}

const app = document.getElementById("app");
// ═══════════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════════
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;") }
function header() {
  return `<img src="logo.png" alt="Alma de Negra" class="logo">
<div class="eyebrow">Taller violencia digital</div>
<h1>${CONFIG.tallerName}</h1>
<p class="sub">visibles a pesar del algoritmo</p>`;
}
function backBtn(target, label) {
  return `<button class="back" onclick="location.hash='${target}'">← ${label || 'Volver'}</button>`;
}
function footer() {
  return `<div class="foot">porque si no nos muestran, nos contamos nosotras mismas.</div>`;
}

// ═══════════════════════════════════════════════════════════════
//  VIEW: Admin
// ═══════════════════════════════════════════════════════════════
let adminAuth = false;

function viewAdmin() {
  if (!adminAuth) {
    app.innerHTML = `${header()}
<div class="card">
  <h2 style="font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 6px">Panel de administración</h2>
  <p style="color:var(--dim);margin:0 0 20px;font-size:.95rem">Ingresá la contraseña para acceder.</p>
  <form id="adminForm">
    <input type="password" id="adminPass" placeholder="Contraseña" style="margin-bottom:14px">
    <button type="submit" class="btn navy" style="width:100%">Entrar</button>
  </form>
  <p id="adminErr" style="color:var(--bad);font-size:.9rem;margin:10px 0 0" hidden>Contraseña incorrecta.</p>
</div>`;
    document.getElementById("adminForm").onsubmit = (e) => {
      e.preventDefault();
      if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
        adminAuth = true;
        viewAdminPanel();
      } else {
        document.getElementById("adminErr").hidden = false;
      }
    };
    return;
  }
  viewAdminPanel();
}

let _unsubs = [];
let _sessions = [], _parts = [], _ups = [], _cfg = {}, _viewSid = null, _viewManual = false;

function fmtDate(s) { if (!s) return ""; const p = s.split("-"); return p.length === 3 ? p[2] + "-" + p[1] + "-" + p[0] : s; }
function sessLabel(s) { return fmtDate(s.date) + " · " + s.name + (_cfg.activeSessionId === s.id ? "  ★ activa" : ""); }
function matchSid(d) { return _viewSid === "all" ? true : _viewSid === "none" ? !d.sessionId : d.sessionId === _viewSid; }

function viewAdminPanel() {
  _unsubs.forEach(u => { try { u() } catch (e) {} }); _unsubs = [];
  if (!firebaseReady) {
    app.innerHTML = `${header()}
<div class="card" id="fbWait"><p style="margin:0"><span class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:var(--coral)"></span> Conectando con Firebase…</p></div>`;
    fbInit.then(ok => {
      if (ok) { viewAdminPanel(); return; }
      document.getElementById("fbWait").innerHTML = `<p style="margin:0 0 8px;color:var(--bad);font-weight:700">No se pudo conectar con Firebase.</p><p style="margin:0 0 14px;font-size:.95rem">${esc(firebaseError || "Error desconocido.")}</p><button class="btn sm" onclick="location.reload()">Reintentar</button>`;
    });
    return;
  }
  app.innerHTML = `${header()}
<h2 style="font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 20px">Panel de administración</h2>

<div class="card">
  <h3 style="font-family:var(--display);font-weight:700;margin:0 0 4px">Sesión del taller</h3>
  <p style="color:var(--dim);font-size:.9rem;margin:0 0 14px">Cada vez que hagas el taller, crea una sesión con su fecha. Las personas se registran en la <strong>sesión activa</strong>, y aquí puedes ver los datos de cada una por separado.</p>
  <div id="activeInfo" style="padding:10px 14px;border-radius:12px;background:color-mix(in srgb, var(--turq) 22%, transparent);font-size:.95rem;margin-bottom:14px"></div>
  <label class="lb" for="sesSel">Ver datos de</label>
  <select id="sesSel" class="fld"></select>
  <button class="btn ghost sm" id="setActive" style="width:100%;margin-bottom:10px">Marcar la sesión elegida como activa</button>
  <button class="btn danger sm" id="sesDel" style="width:100%;margin-bottom:18px">Eliminar esta sesión y sus datos</button>
  <div style="border-top:1px solid var(--line);padding-top:16px">
    <strong style="font-size:.95rem">Nueva sesión</strong>
    <label class="lb" for="sesName" style="margin-top:10px">Nombre</label>
    <input type="text" id="sesName" value="Taller violencia digital" style="margin-bottom:10px">
    <label class="lb" for="sesDate">Fecha</label>
    <input type="date" id="sesDate" class="fld">
    <button class="btn sm" id="sesNew" style="width:100%">Crear sesión y activarla</button>
  </div>
</div>

<div class="stat-row">
  <div class="stat"><div class="n" id="statPart">–</div><div class="l">Participantes</div></div>
  <div class="stat"><div class="n" id="statPhotos">–</div><div class="l">Fotos subidas</div></div>
</div>

<div class="card">
  <h3 style="font-family:var(--display);font-weight:700;margin:0 0 14px">Actividades</h3>
  <p style="color:var(--dim);font-size:.9rem;margin:0 0 14px">Activá o desactivá las actividades. Las personas verán los cambios al instante.</p>
  <div class="toggle-row">
    <div>
      <strong>Actividad 1: Trivia</strong>
      <div style="font-size:.85rem;color:var(--dim)">Preguntas sobre shadowban y violencia digital</div>
    </div>
    <label class="toggle"><input type="checkbox" id="togTrivia" checked><span class="slider"></span></label>
  </div>
  <div class="toggle-row">
    <div>
      <strong>Actividad 2: Collage</strong>
      <div style="font-size:.85rem;color:var(--dim)">Subir foto del collage</div>
    </div>
    <label class="toggle"><input type="checkbox" id="togCollage" checked><span class="slider"></span></label>
  </div>
</div>

<div class="card">
  <h3 style="font-family:var(--display);font-weight:700;margin:0 0 4px">Código QR</h3>
  <p style="color:var(--dim);font-size:.9rem;margin:0 0 14px">Las personas escanean este código para entrar al taller.</p>
  <div id="qrContainer" style="text-align:center">
    <img id="qrImg" alt="Código QR del taller" style="max-width:240px;border-radius:12px;background:#fff;padding:12px">
  </div>
  <p style="text-align:center;font-size:.85rem;color:var(--dim);margin:10px 0 0;word-break:break-all" id="qrUrl"></p>
</div>

<div class="card">
  <h3 style="font-family:var(--display);font-weight:700;margin:0 0 14px">Participantes</h3>
  <button class="btn ghost sm" id="dlCsv" style="margin-bottom:12px">⬇ Lista de participantes (CSV)</button>
  <ul class="p-list" id="partList"><li style="color:var(--dim)">Cargando...</li></ul>
</div>

<div class="card">
  <h3 style="font-family:var(--display);font-weight:700;margin:0 0 14px">Galería de collages</h3>
  <button class="btn turq sm" id="dlAll" style="margin-bottom:14px" disabled>⬇ Descargar fotos de esta sesión (ZIP)</button>
  <div id="adminGallery" style="color:var(--dim);font-size:.95rem">Cargando fotos...</div>
</div>

<div style="margin-top:20px;text-align:center">
  <button class="btn ghost sm" onclick="adminAuth=false;viewAdmin()">Cerrar sesión admin</button>
</div>
${footer()}`;

  // QR
  const pageUrl = location.href.split("#")[0].split("?")[0].replace(/admin\.html$/, "");
  document.getElementById("qrImg").src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(pageUrl);
  document.getElementById("qrUrl").textContent = pageUrl;
  document.getElementById("sesDate").value = new Date().toLocaleDateString("en-CA");

  const $ = id => document.getElementById(id);

  function renderSessionUI() {
    const act = _sessions.find(s => s.id === _cfg.activeSessionId);
    $("activeInfo").innerHTML = act ? "Sesión activa: <strong>" + esc(sessLabel(act).replace("  ★ activa", "")) + "</strong>" : "No hay sesión activa: las personas se registran sin sesión. Crea una abajo.";
    if (!_viewManual || (_viewSid !== "all" && _viewSid !== "none" && !_sessions.find(s => s.id === _viewSid))) _viewSid = (act && act.id) || (_sessions[0] && _sessions[0].id) || "all";
    const opts = _sessions.map(s => `<option value="${esc(s.id)}">${esc(sessLabel(s))}</option>`).join("")
      + '<option value="all">Todas las sesiones</option><option value="none">Sin sesión (anteriores)</option>';
    $("sesSel").innerHTML = opts; $("sesSel").value = _viewSid;
    $("setActive").hidden = (_viewSid === "all" || _viewSid === "none");
    $("sesDel").hidden = (_viewSid === "all");
    $("sesDel").textContent = _viewSid === "none" ? "Borrar los datos sin sesión" : "Eliminar esta sesión y sus datos";
  }

  function renderData() {
    const parts = _parts.filter(matchSid), ups = _ups.filter(matchSid);
    $("statPart").textContent = parts.length; $("statPhotos").textContent = ups.length;
    const list = $("partList");
    list.innerHTML = parts.length ? parts.map(d => {
      const t = d.timestamp ? new Date(d.timestamp.toDate()).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }) : "";
      const sc = d.triviaScore !== undefined ? ` — Trivia: ${d.triviaScore}/${d.triviaTotal}` : "";
      return `<li><span>${esc(d.name)}${sc}</span><span class="time">${t}</span></li>`;
    }).join("") : '<li style="color:var(--dim)">Aún no hay participantes en esta vista.</li>';
    window._photos = ups.filter(d => d.imageData).map(d => ({ name: d.participantName || "sin-nombre", data: d.imageData }));
    $("dlAll").disabled = !window._photos.length;
    $("adminGallery").innerHTML = ups.length ? '<div class="gallery">' + ups.map(d => `<div class="photo-card">
        <img src="${esc(d.imageData || "")}" alt="Collage de ${esc(d.participantName || "")}" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover">
        <div class="name-tag">${esc(d.participantName || "")}</div>
        <button class="x" data-id="${esc(d._id)}" title="Eliminar esta foto">✕</button></div>`).join("") + '</div>' : '<p style="color:var(--dim)">Aún no hay fotos en esta vista.</p>';
  }

  // sesiones
  _unsubs.push(fdb.collection("sessions").onSnapshot(snap => {
    _sessions = []; snap.forEach(d => _sessions.push(Object.assign({ id: d.id }, d.data())));
    _sessions.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    renderSessionUI(); renderData();
  }, () => {}));
  // configuración
  _unsubs.push(fdb.doc("config/settings").onSnapshot(snap => {
    _cfg = snap.exists ? snap.data() : {};
    $("togTrivia").checked = _cfg.trivia !== false; $("togCollage").checked = _cfg.collage !== false;
    renderSessionUI(); renderData();
  }, () => {}));
  // participantes y fotos
  _unsubs.push(fdb.collection("participants").onSnapshot(snap => {
    _parts = []; snap.forEach(d => _parts.push(Object.assign({ _id: d.id }, d.data())));
    _parts.sort((a, b) => (b.timestamp ? b.timestamp.seconds : 9e12) - (a.timestamp ? a.timestamp.seconds : 9e12));
    renderData();
  }, () => {}));
  _unsubs.push(fdb.collection("uploads").onSnapshot(snap => {
    _ups = []; snap.forEach(d => _ups.push(Object.assign({ _id: d.id }, d.data())));
    _ups.sort((a, b) => (b.timestamp ? b.timestamp.seconds : 9e12) - (a.timestamp ? a.timestamp.seconds : 9e12));
    renderData();
  }, () => {}));

  $("sesSel").onchange = function() { _viewSid = this.value; _viewManual = true; renderSessionUI(); renderData(); };
  $("setActive").onclick = () => { if (_viewSid && _viewSid !== "all" && _viewSid !== "none") fdb.doc("config/settings").set({ activeSessionId: _viewSid }, { merge: true }); };
  $("sesNew").onclick = async function() {
    const name = $("sesName").value.trim() || "Taller", date = $("sesDate").value;
    if (!date) { alert("Elige la fecha de la sesión."); return; }
    this.disabled = true;
    try {
      const ref = await fdb.collection("sessions").add({ name, date, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      await fdb.doc("config/settings").set({ activeSessionId: ref.id }, { merge: true });
      _viewSid = ref.id; _viewManual = false;
    } catch (e) { alert("No se pudo crear la sesión."); console.error(e); }
    this.disabled = false;
  };
  $("adminGallery").onclick = async (e) => {
    const b = e.target.closest(".x"); if (!b) return;
    if (!confirm("¿Eliminar esta foto? No se puede deshacer.")) return;
    try { await fdb.collection("uploads").doc(b.dataset.id).delete(); } catch (err) { alert("No se pudo eliminar la foto."); console.error(err); }
  };

  $("sesDel").onclick = async function() {
    if (_viewSid === "all") return;
    const s = _sessions.find(x => x.id === _viewSid);
    const label = s ? fmtDate(s.date) + " · " + s.name : "datos sin sesión";
    const parts = _parts.filter(matchSid), ups = _ups.filter(matchSid);
    const ans = prompt("Vas a eliminar \"" + label + "\" con " + parts.length + " participantes y " + ups.length + " fotos.\nEsto NO se puede deshacer. Descarga antes el ZIP de fotos.\n\nEscribe BORRAR para confirmar:");
    if (ans === null || ans.trim().toUpperCase() !== "BORRAR") return;
    this.disabled = true;
    try {
      const refs = parts.map(d => fdb.collection("participants").doc(d._id)).concat(ups.map(d => fdb.collection("uploads").doc(d._id)));
      if (s) refs.push(fdb.collection("sessions").doc(s.id));
      for (let i = 0; i < refs.length; i += 400) { const b = fdb.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
      if (s && _cfg.activeSessionId === s.id) await fdb.doc("config/settings").set({ activeSessionId: firebase.firestore.FieldValue.delete() }, { merge: true });
      _viewManual = false;
    } catch (e) { alert("No se pudo eliminar."); console.error(e); }
    this.disabled = false;
  };

  $("dlCsv").onclick = () => {
    const s = _sessions.find(x => x.id === _viewSid);
    const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const rows = [["Nombre", "Sesión", "Fecha de la sesión", "Trivia", "Hora de registro"]];
    _parts.filter(matchSid).forEach(d => {
      const ss = _sessions.find(x => x.id === d.sessionId);
      rows.push([d.name, ss ? ss.name : "", ss ? ss.date : "", d.triviaScore !== undefined ? d.triviaScore + "/" + d.triviaTotal : "", d.timestamp ? d.timestamp.toDate().toLocaleString("es-CL") : ""]);
    });
    const blob = new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "participantes-shadowban" + (s ? "-" + s.date : "") + ".csv"; a.click();
  };

  $("togTrivia").onchange = function() { fdb.doc("config/settings").set({ trivia: this.checked }, { merge: true }); };
  $("togCollage").onchange = function() { fdb.doc("config/settings").set({ collage: this.checked }, { merge: true }); };

  $("dlAll").onclick = async function() {
    const btn = this; btn.disabled = true; btn.textContent = "Preparando ZIP...";
    try {
      if (!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
      const zip = new JSZip(); const used = {};
      window._photos.forEach(p => {
        const base = p.name.replace(/[^\w\-áéíóúñÁÉÍÓÚÑ ]/g, "").trim() || "foto";
        used[base] = (used[base] || 0) + 1;
        zip.file(base + "_" + used[base] + ".jpg", p.data.split(",")[1], { base64: true });
      });
      const s = _sessions.find(x => x.id === _viewSid);
      const blob = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = "collages-shadowban" + (s ? "-" + s.date : "") + ".zip"; a.click();
    } catch (e) { alert("No se pudo crear el ZIP."); console.error(e); }
    btn.disabled = false; btn.textContent = "⬇ Descargar fotos de esta sesión (ZIP)";
  };
}


const fbInit = initFirebase();
viewAdmin();


</script>
</body>
</html>
