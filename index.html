<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHADOWBAN Taller</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: single-column mobile-first, max-width 540px centered, card-based UI */
:root {
  --bg: #F6EFE3;
  --card: #FFFAF1;
  --ink: #241A17;
  --dim: #6B5D55;
  --coral: #DE5D48;
  --coral-soft: #e8866e;
  --turq: #58E4BF;
  --turq-dim: #3aab8e;
  --navy: #0F1830;
  --ochre: #B9801C;
  --ok: #2F8F5B;
  --bad: #B3392B;
  --line: #E3D6C3;
  --display: 'Bricolage Grotesque', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150F0D; --card: #231A17; --ink: #F1E8D9; --dim: #B8A99A;
    --coral: #E0714B; --coral-soft: #c45733; --turq: #58E4BF; --turq-dim: #3aab8e;
    --navy: #0A0F1E; --ochre: #E0A33D; --ok: #5FCF93; --bad: #FF7A68;
    --line: #3A2B26; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150F0D; --card: #231A17; --ink: #F1E8D9; --dim: #B8A99A;
  --coral: #E0714B; --coral-soft: #c45733; --turq: #58E4BF; --turq-dim: #3aab8e;
  --navy: #0A0F1E; --ochre: #E0A33D; --ok: #5FCF93; --bad: #FF7A68;
  --line: #3A2B26; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); line-height: 1.5;
  padding-inline: 16px;
}
main {
  max-width: 540px; margin: 0 auto;
  padding-block: 24px 48px;
}

/* ── Shared elements ── */
.eyebrow {
  color: var(--ochre); font-size: .72rem; letter-spacing: .14em;
  font-weight: 700; text-transform: uppercase; margin-bottom: 4px;
}
h1 {
  font-family: var(--display); font-weight: 800;
  font-size: 2.4rem; letter-spacing: -.02em; margin: 0 0 4px;
}
.sub {
  font-style: italic; color: var(--coral); margin: 0 0 24px;
  font-size: 1.05rem;
}
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 24px; margin-bottom: 16px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 14px 28px; border: 0; border-radius: 14px;
  background: var(--coral); color: #fff;
  font-family: var(--body); font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: opacity .15s;
}
.btn:hover:not(:disabled) { opacity: .85 }
.btn:disabled { opacity: .5; cursor: not-allowed }
.btn.ghost {
  background: transparent; color: var(--ink);
  border: 1.5px solid var(--line);
}
.btn.turq { background: var(--turq); color: var(--navy) }
.btn.navy { background: var(--navy); color: #fff }
.btn.sm { padding: 10px 18px; font-size: .9rem; border-radius: 12px }
input[type="text"], input[type="password"] {
  width: 100%; padding: 14px 16px; border: 1.5px solid var(--line);
  border-radius: 12px; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 1rem; box-sizing: border-box;
}
input:focus { outline: 2px solid var(--coral); border-color: var(--coral) }

.foot {
  margin-top: 32px; text-align: center; font-style: italic;
  color: var(--dim); font-size: .88rem;
}

/* ── Activity cards ── */
.act-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 18px; padding: 28px; cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.act-card:hover:not(.locked) { border-color: var(--coral); transform: translateY(-2px) }
.act-card.locked { opacity: .55; cursor: not-allowed }
.act-card .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--coral); color: #fff;
  font-family: var(--display); font-weight: 800; font-size: .9rem;
}
.act-card.locked .num { background: var(--dim) }
.act-card h3 {
  font-family: var(--display); font-weight: 700;
  font-size: 1.3rem; margin: 10px 0 6px;
}
.act-card p { color: var(--dim); margin: 0; font-size: .95rem }
.act-card .lock-badge {
  display: inline-block; margin-top: 10px; padding: 4px 12px;
  border-radius: 8px; background: var(--line); color: var(--dim);
  font-size: .8rem; font-weight: 700;
}

/* ── Trivia ── */
.tabs { display: flex; gap: 8px; margin-bottom: 16px }
.tabs button {
  flex: 1; padding: 10px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); border-radius: 12px;
  font-family: var(--body); font-weight: 600; cursor: pointer;
}
.tabs button.on { background: var(--coral); border-color: var(--coral); color: #fff }
.meta { color: var(--dim); font-size: .85rem; margin-bottom: 8px }
.q { font-size: 1.15rem; font-weight: 600; margin: 0 0 14px }
.opt {
  display: block; width: 100%; text-align: left; margin: 8px 0;
  padding: 12px 14px; border: 1.5px solid var(--line);
  background: transparent; color: var(--ink); border-radius: 12px;
  font-family: var(--body); font-size: 1rem; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--coral) }
.opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, transparent) }
.opt.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent) }
.exp {
  margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--ochre);
  background: color-mix(in srgb, var(--ochre) 10%, transparent);
  border-radius: 6px; font-size: .95rem;
}
.hint {
  color: var(--dim); font-size: .9rem; cursor: pointer;
  text-decoration: underline; margin-top: 6px; display: inline-block;
}
.row { display: flex; gap: 8px; margin-top: 16px; justify-content: space-between }
.flip {
  min-height: 220px; display: flex; flex-direction: column;
  justify-content: center; cursor: pointer; text-align: center;
}
.flip .lab {
  color: var(--ochre); font-size: .72rem; letter-spacing: .14em;
  font-weight: 600; text-transform: uppercase; margin-bottom: 10px;
}
.flip .big { font-size: 1.2rem; font-weight: 600 }
.flip .small { margin-top: 12px; color: var(--dim); font-size: .95rem }
.score { font-size: 3rem; font-weight: 700; color: var(--coral); margin: .2rem 0 }

/* ── Upload zone ── */
.upload-zone {
  border: 2px dashed var(--line); border-radius: 18px;
  padding: 40px 20px; text-align: center; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--turq); background: color-mix(in srgb, var(--turq) 8%, transparent) }
.upload-zone svg { margin-bottom: 12px }
.upload-zone p { margin: 0; color: var(--dim) }
.preview-img {
  width: 100%; max-height: 400px; object-fit: contain;
  border-radius: 12px; margin-top: 16px;
}
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px }
.gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--line) }

/* ── Admin ── */
.stat-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap }
.stat {
  flex: 1; min-width: 120px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 16px; text-align: center;
}
.stat .n { font-family: var(--display); font-size: 2rem; font-weight: 800; color: var(--coral) }
.stat .l { font-size: .82rem; color: var(--dim); margin-top: 2px }
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.toggle-row:last-child { border-bottom: 0 }
.toggle {
  position: relative; width: 52px; height: 28px; cursor: pointer;
}
.toggle input { position: absolute; opacity: 0; width: 0; height: 0 }
.toggle .slider {
  position: absolute; inset: 0; background: var(--line); border-radius: 14px;
  transition: background .2s;
}
.toggle .slider::after {
  content: ''; position: absolute; left: 3px; top: 3px;
  width: 22px; height: 22px; background: #fff; border-radius: 50%;
  transition: transform .2s;
}
.toggle input:checked + .slider { background: var(--ok) }
.toggle input:checked + .slider::after { transform: translateX(24px) }

.p-list { list-style: none; padding: 0; margin: 0 }
.p-list li {
  padding: 10px 0; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  font-size: .95rem;
}
.p-list li:last-child { border-bottom: 0 }
.p-list .time { color: var(--dim); font-size: .82rem }

/* ── Config notice ── */
.config-warn {
  background: color-mix(in srgb, var(--ochre) 14%, transparent);
  border: 1.5px solid var(--ochre); border-radius: 14px;
  padding: 20px; margin-bottom: 20px; font-size: .95rem;
}
.config-warn strong { color: var(--ochre) }

/* ── Back nav ── */
.back {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--dim); font-size: .9rem; cursor: pointer;
  background: none; border: 0; font-family: var(--body);
  padding: 0; margin-bottom: 16px;
}
.back:hover { color: var(--ink) }

/* ── Progress dots ── */
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px }
.dots span {
  width: 8px; height: 8px; border-radius: 50%; background: var(--line);
}
.dots span.on { background: var(--coral) }

/* ── Spinner ── */
.spin {
  display: inline-block; width: 20px; height: 20px;
  border: 2.5px solid rgba(255,255,255,.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* ── Photo card overlay ── */
.photo-card {
  position: relative; border-radius: 12px; overflow: hidden;
}
.photo-card img { display: block }
.photo-card .name-tag {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 8px 12px; background: linear-gradient(transparent, rgba(0,0,0,.7));
  color: #fff; font-size: .82rem; font-weight: 700;
}
.logo { display:block; width:140px; height:auto; margin:0 auto 14px; border-radius:20px; background:#fff }
.eyebrow, h1, .sub { text-align:center }

/* ── Kit de recursos / stories ── */
details.kit { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; padding: 0 18px }
details.kit summary { cursor: pointer; padding: 16px 0; font-family: var(--display); font-weight: 700; font-size: 1.05rem; list-style: none }
details.kit summary::-webkit-details-marker { display: none }
details.kit summary::after { content: '+'; float: right; color: var(--coral); font-size: 1.4rem; line-height: 1 }
details.kit[open] summary::after { content: '–' }
details.kit .body { padding: 0 0 16px; font-size: .95rem }
details.kit ul { margin: 6px 0 0; padding-left: 20px }
details.kit li { margin: 5px 0 }
.chip { display: inline-block; padding: 2px 10px; border-radius: 8px; background: color-mix(in srgb, var(--turq) 30%, transparent); font-weight: 700; font-size: .9rem }
.tpl-row { display: flex; gap: 10px; margin: 6px 0 14px }
.tpl { flex: 1; height: 44px; border-radius: 12px; border: 2.5px solid var(--line); cursor: pointer }
.tpl.on { border-color: var(--coral); box-shadow: 0 0 0 2px var(--coral) }
select, textarea.fld { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; margin-bottom: 12px }
label.lb { display: block; font-size: .85rem; font-weight: 700; color: var(--dim); margin-bottom: 4px }

.act-list .act-card { display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:10px; border-radius:16px }
.act-list .act-card .num { flex:none; width:34px; height:34px }
.act-list .act-card h3 { margin:0 0 2px; font-size:1.05rem }
.act-list .act-card p { font-size:.85rem }
.act-list .act-card .lock-badge { margin-top:6px }
[hidden] { display: none !important }
</style>
</head>
<body>

<main id="app"></main>

<script src="config.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  Firebase SDK loader (carga desde CDN de Google)
// ═══════════════════════════════════════════════════════════════
let fb = null, fdb = null;
let firebaseReady = false;
let firebaseError = "";

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initFirebase() {
  if (!CONFIG.firebase.apiKey) { firebaseError = "config.js no tiene las credenciales de Firebase (apiKey vacío)."; return false; }
  try {
    const V = "10.12.0";
    const CDN = "https://www.gstatic.com/firebasejs/" + V;
    // Load app first, then firestore + storage in parallel
    await loadScript(CDN + "/firebase-app-compat.js");
    await loadScript(CDN + "/firebase-firestore-compat.js");
    fb = firebase.initializeApp(CONFIG.firebase);
    fdb = firebase.firestore();
    firebaseReady = true;
    return true;
  } catch (e) {
    console.error("Firebase init error:", e);
    firebaseError = "No se pudieron cargar los scripts de Firebase (revisa tu conexión a internet o si algún bloqueador los impide).";
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════
let participantId = null;
let participantName = "";
let participantSid = null;
try {
  participantId = localStorage.getItem("sb_pid");
  participantName = localStorage.getItem("sb_pname") || "";
  participantSid = localStorage.getItem("sb_sid");
} catch(e) {}

const app = document.getElementById("app");

// ═══════════════════════════════════════════════════════════════
//  Router
// ═══════════════════════════════════════════════════════════════
function route() {
  const hash = location.hash.slice(1) || "";
  if (hash === "trivia") return viewTrivia();
  if (hash === "collage") return viewCollage();
  if (hash === "compartir") return viewCompartir();
  if (hash === "recursos") return viewRecursos();
  if (hash === "stories") return viewStories();
  if (hash === "actividades") {
    if (!participantId) return viewRegistro();
    return viewActividades();
  }
  if (participantId) return viewActividades();
  return viewRegistro();
}
window.addEventListener("hashchange", route);

// ═══════════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════════
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;") }
function header() {
  return `<img src="logo.png" alt="Alma de Negra" class="logo">
<div class="eyebrow">Taller violencia digital</div>
<h1>${CONFIG.tallerName}</h1>
<p class="sub">visibles a pesar del algoritmo</p>`;
}
function backBtn(target, label) {
  return `<button class="back" onclick="location.hash='${target}'">← ${label || 'Volver'}</button>`;
}
function footer() {
  return `<div class="foot">porque si no nos muestran, nos contamos nosotras mismas.</div>`;
}

// ═══════════════════════════════════════════════════════════════
//  VIEW: Registro
// ═══════════════════════════════════════════════════════════════
function viewRegistro() {
  app.innerHTML = `${header()}
<div class="card">
  <h2 style="font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 6px">¡Bienvenida!</h2>
  <p style="color:var(--dim);margin:0 0 20px;font-size:.95rem">Escribe tu nombre para participar en las actividades del taller.</p>
  <form id="regForm">
    <input type="text" id="nameInput" placeholder="Tu nombre" autocomplete="off" required style="margin-bottom:14px">
    <button type="submit" class="btn" style="width:100%">Entrar al taller</button>
  </form>
  <p id="regErr" style="color:var(--bad);font-size:.9rem;margin:10px 0 0" hidden></p>
</div>
${footer()}`;

  document.getElementById("regForm").onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return;
    const errEl = document.getElementById("regErr");
    const btn = e.target.querySelector("button");
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Registrando...';

    if (!firebaseReady) {
      // Modo sin Firebase — solo localStorage
      participantId = "local_" + Date.now();
      participantName = name;
      participantSid = "-";
      try {
        localStorage.setItem("sb_pid", participantId);
        localStorage.setItem("sb_pname", participantName);
        localStorage.setItem("sb_sid", participantSid);
      } catch(ex) {}
      location.hash = "actividades";
      return;
    }

    try {
      let active = null;
      try { const cs = await fdb.doc("config/settings").get(); if (cs.exists) active = cs.data().activeSessionId || null; } catch (ex) {}
      const doc = await fdb.collection("participants").add({
        name: name,
        sessionId: active,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      participantId = doc.id;
      participantName = name;
      participantSid = active || "-";
      try {
        localStorage.setItem("sb_pid", participantId);
        localStorage.setItem("sb_pname", participantName);
        localStorage.setItem("sb_sid", participantSid);
      } catch(ex) {}
      location.hash = "actividades";
    } catch (err) {
      console.error(err);
      errEl.textContent = "Error al registrar. Intentá de nuevo.";
      errEl.hidden = false;
      btn.disabled = false;
      btn.textContent = "Entrar al taller";
    }
  };
}

// ═══════════════════════════════════════════════════════════════
//  VIEW: Actividades (hub)
// ═══════════════════════════════════════════════════════════════
let activityConfig = { trivia: true, collage: true };
let configUnsub = null;

function viewActividades() {
  // Listen for config changes
  if (firebaseReady && !configUnsub) {
    configUnsub = fdb.doc("config/settings").onSnapshot(snap => {
      if (snap.exists) {
        const d = snap.data();
        activityConfig.trivia = d.trivia !== false;
        activityConfig.collage = d.collage !== false;
        if (location.hash === "#actividades" || location.hash === "") renderActividades();
      }
    }, () => {});
  }
  renderActividades();
}

function renderActividades() {
  const t = activityConfig.trivia;
  const c = activityConfig.collage;
  const lock = '<span class="lock-badge">🔒 Esperá la indicación</span>';

  app.innerHTML = `${header()}
<p style="margin:0 0 16px;font-size:.95rem">Hola <strong>${esc(participantName)}</strong> 👋 Estas son las actividades del taller:</p>

<div class="act-list">
  <div class="act-card ${t?'':'locked'}" id="actTrivia">
    <span class="num">1</span>
    <div><h3>Trivia: ¿Qué sabés del shadowban?</h3><p>Censura algorítmica, violencia digital y resistencia en redes.</p>${t?'':lock}</div>
  </div>
  <div class="act-card ${c?'':'locked'}" id="actCollage">
    <span class="num">2</span>
    <div><h3>Collage: Subí tu obra</h3><p>Sácale una foto a tu collage y compártela con el grupo.</p>${c?'':lock}</div>
  </div>
  <div class="act-card" id="actStories">
    <span class="num" style="background:var(--turq);color:var(--navy)">3</span>
    <div><h3>Plantilla para stories</h3><p>Tu frase + el logo + @${esc(CONFIG.social.handle)}, lista para Instagram.</p></div>
  </div>
  <div class="act-card" id="actKit">
    <span class="num" style="background:var(--ochre)">4</span>
    <div><h3>Mini kit de recursos</h3><p>Cómo documentar, protegerte y pedir ayuda.</p></div>
  </div>
</div>

<div style="margin-top:20px;text-align:center">
  <button class="btn ghost sm" onclick="participantId=null;participantName='';participantSid=null;try{localStorage.removeItem('sb_pid');localStorage.removeItem('sb_pname');localStorage.removeItem('sb_sid')}catch(e){};location.hash=''">Cambiar nombre</button>
</div>
${footer()}`;

  if (t) document.getElementById("actTrivia").onclick = () => location.hash = "trivia";
  if (c) document.getElementById("actCollage").onclick = () => location.hash = "collage";
  document.getElementById("actStories").onclick = () => location.hash = "stories";
  document.getElementById("actKit").onclick = () => location.hash = "recursos";
}

// ═══════════════════════════════════════════════════════════════
//  VIEW: Trivia
// ═══════════════════════════════════════════════════════════════
const QUESTIONS = [
  {p:"¿Qué es el “shadowban”?",o:["Cuando te bloquean la cuenta por completo","Cuando la plataforma reduce tu alcance sin avisarte ni explicarte por qué","Un modo oscuro de la app","Cuando borran tu cuenta por reportes falsos"],c:1,h:"Tiene que ver con la palabra “sombra”…",e:"El shadowban es censura silenciosa: seguís publicando, pero casi nadie ve tu contenido, y la plataforma no te lo dice ni da explicación."},
  {p:"En 2020 se denunció que una plataforma muy popular entre jóvenes bloqueó temporalmente las vistas del hashtag #BlackLivesMatter. ¿Cuál fue?",o:["TikTok","Pinterest","LinkedIn","Spotify"],c:0,h:"Es la app de videos cortos con mucha música.",e:"TikTok reconoció el error y pidió disculpas, pero quedó como uno de los casos más citados de censura algorítmica hacia el activismo afro."},

let qi = 0, qscore = 0, qdone = false, fi = 0, fflipped = false;

function viewTrivia() {
  app.innerHTML = `${backBtn('actividades','Actividades')}
${header()}
<div class="tabs"><button id="tq" class="on">Trivia</button><button id="tf">Tarjetas</button></div>
<div id="triviaApp"></div>
${footer()}`;

  const tq = document.getElementById("tq");
  const tf = document.getElementById("tf");
  let mode = "q";
  qi = 0; qscore = 0; fi = 0; fflipped = false;

  function setMode(m) {
    mode = m;
    tq.classList.toggle("on", m==="q");
    tf.classList.toggle("on", m==="f");
    m==="q" ? renderQuiz() : renderCards();
  }
  tq.onclick = () => setMode("q");
  tf.onclick = () => setMode("f");

  function renderQuiz() {
    const ta = document.getElementById("triviaApp");
    if (qi >= QUESTIONS.length) {
      ta.innerHTML = `<div class="card" style="text-align:center">
        <div class="meta">Resultado</div>
        <div class="score">${qscore}/${QUESTIONS.length}</div>
        <p>${qscore >= 6 ? '¡Ya sabés cómo funciona el silencio algorítmico!' : 'Ahora sabés un poco más de lo que el algoritmo no quiere que veas.'}</p>
        <div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn" id="rs">Jugar de nuevo</button><button class="btn turq" onclick="location.hash='compartir'">Compartir en redes</button></div>
      </div>`;
      document.getElementById("rs").onclick = () => { qi=0; qscore=0; renderQuiz() };

      // Save score to Firebase
      if (firebaseReady && participantId && participantId.indexOf("local_") !== 0) {
        fdb.collection("participants").doc(participantId).update({
          triviaScore: qscore,
          triviaTotal: QUESTIONS.length
        }).catch(() => {});
      }
      return;
    }
    const q = QUESTIONS[qi];
    qdone = false;
    ta.innerHTML = `<div class="card">
      <div class="meta">Pregunta ${qi+1} de ${QUESTIONS.length}</div>
      <p class="q">${esc(q.p)}</p>
      <div id="os">${q.o.map((t,k) => `<button class="opt" data-k="${k}">${esc(t)}</button>`).join("")}</div>
      <span class="hint" id="qhint">Ver pista</span>
      <div id="qex"></div>
      <div class="row"><span></span><button class="btn sm" id="qnx" hidden>${qi===QUESTIONS.length-1?'Ver resultado':'Siguiente'}</button></div>
    </div>
    <div class="dots">${QUESTIONS.map((_,j) => `<span class="${j===qi?'on':''}"></span>`).join("")}</div>`;

    document.getElementById("qhint").onclick = function() { this.textContent = q.h; this.style.textDecoration = "none" };
    ta.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (qdone) return; qdone = true;
      const k = +b.dataset.k;
      if (k === q.c) qscore++;
      ta.querySelectorAll(".opt").forEach(x => {
        x.disabled = true;
        const n = +x.dataset.k;
        if (n === q.c) x.classList.add("ok");
        else if (n === k) x.classList.add("bad");
      });
      document.getElementById("qex").innerHTML = `<div class="exp"><strong>${k===q.c?'¡Correcto!':'Casi.'}</strong> ${esc(q.e)}</div>`;
      const nx = document.getElementById("qnx");
      nx.hidden = false;
      nx.onclick = () => { qi++; renderQuiz() };
    });
  }

  function renderCards() {
    const ta = document.getElementById("triviaApp");
    const q = QUESTIONS[fi];
    ta.innerHTML = `<div class="card flip" id="fl">${fflipped
      ? `<div class="lab">Respuesta</div><div class="big">${esc(q.o[q.c])}</div><div class="small">${esc(q.e)}</div>`
      : `<div class="lab">Tarjeta ${fi+1} de ${QUESTIONS.length}</div><div class="big">${esc(q.p)}</div><div class="small">Tocá para dar vuelta</div>`

    document.getElementById("fpv").onclick = () => { fi = (fi-1+QUESTIONS.length)%QUESTIONS.length; fflipped = false; renderCards() };
    document.getElementById("fnt").onclick = () => { fi = (fi+1)%QUESTIONS.length; fflipped = false; renderCards() };
  }

  setMode("q");
}

async function loadMyUploads() {
  const container = document.getElementById("myUploads");
  if (!container || !firebaseReady || !participantId || participantId.indexOf("local_") === 0) return;

  try {
    const snap = await fdb.collection("uploads")
      .where("participantId", "==", participantId)
      .get();

    if (snap.empty) return;

    let html = `<div class="card"><h3 style="font-family:var(--display);font-weight:700;margin:0 0 12px">Tus fotos subidas</h3><div class="gallery">`;
    snap.forEach(doc => {
      const d = doc.data();
      html += `<img src="${esc(d.imageData)}" alt="Tu collage" loading="lazy">`;
    });
    html += `</div></div>`;
    container.innerHTML = html;
  } catch (e) {
    console.error(e);
  }
}

function blobToDataURL(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}

// Image compression
function compressImage(file, maxDim, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim }
        else { w = Math.round(w * maxDim / h); h = maxDim }
      }
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob), "image/jpeg", quality);
    };
    img.src = URL.createObjectURL(file);
  });
}

  { bg: "#DE5D48", ink: "#FFFFFF", acc: "#58E4BF", sub: "#FFE9DF" },
  { bg: "#0F1830", ink: "#FFFFFF", acc: "#58E4BF", sub: "#B8C4E0" },
  { bg: "#F6EFE3", ink: "#241A17", acc: "#DE5D48", sub: "#6B5D55" }
];
const STORY_PROMPTS = [
  "Para mí, el shadowban es…",
  "No quiero que me callen sobre…",
  "Visible a pesar del algoritmo porque…",
  "Mi collage dice…",

];
let storyLogo = null;

function wrapLines(ctx, text, maxW) {
  const out = [];
  text.split("\n").forEach(par => {
    let line = "";
    par.split(/\s+/).forEach(w => {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else { line = test; }
    });
    out.push(line);
  });
  return out;
}

function drawStory(cv, o) {
  const ctx = cv.getContext("2d"), W = 1080, H = 1920, P = STORY_PALETTES[o.tpl];
  const disp = "'Bricolage Grotesque', system-ui, sans-serif", body = "'Atkinson Hyperlegible', system-ui, sans-serif";
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  // decoración: círculos suaves
  ctx.globalAlpha = 0.14; ctx.fillStyle = P.acc;
  ctx.beginPath(); ctx.arc(W + 40, 420, 420, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(-60, H - 380, 360, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  // logo
  if (storyLogo) {
    const s = 250, x = (W - s) / 2, y = 260, r = 44;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + s, y, x + s, y + s, r); ctx.arcTo(x + s, y + s, x, y + s, r);
    ctx.arcTo(x, y + s, x, y, r); ctx.arcTo(x, y, x + s, y, r); ctx.closePath(); ctx.clip();
    ctx.fillStyle = "#fff"; ctx.fillRect(x, y, s, s); ctx.drawImage(storyLogo, x, y, s, s); ctx.restore();
  }
  ctx.fillStyle = P.acc; ctx.font = "700 34px " + body;
  if ("letterSpacing" in ctx) ctx.letterSpacing = "6px";
  ctx.fillText("TALLER VIOLENCIA DIGITAL", W / 2, 592);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  ctx.fillStyle = P.ink; ctx.font = "800 118px " + disp;
  ctx.fillText("SHADOWBAN", W / 2, 720);
  // pregunta
  ctx.fillStyle = P.acc; ctx.font = "italic 700 50px " + body;
  const pl = wrapLines(ctx, o.prompt, 880); let y = 840;
  pl.forEach(l => { ctx.fillText(l, W / 2, y); y += 62; });
  // respuesta con tamaño automático
  const top = y + 40, boxH = 1480 - top, text = (o.text || "Escribe tu frase acá").trim();
  let size = 96, lines;
  for (; size >= 40; size -= 4) {
    ctx.font = "800 " + size + "px " + disp; lines = wrapLines(ctx, text, 880);
    if (lines.length * size * 1.2 <= boxH) break;
  }
  ctx.fillStyle = o.text ? P.ink : P.sub;
  let ty = top + size; lines.forEach(l => { ctx.fillText(l, W / 2, ty); ty += size * 1.2; });
  if (o.name) { ctx.fillStyle = P.sub; ctx.font = "700 42px " + body; ctx.fillText("— " + o.name, W / 2, ty + 20); }
  // pie
  ctx.fillStyle = P.acc; ctx.font = "800 66px " + disp; ctx.fillText("@" + CONFIG.social.handle, W / 2, 1570);
  ctx.fillStyle = P.sub; ctx.font = "italic 400 38px " + body; ctx.fillText("visibles a pesar del algoritmo", W / 2, 1636);
}

function viewStories() {
  app.innerHTML = `${backBtn('actividades','Actividades')}
${header()}
<div class="card">
  <h2 style="font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0 0 6px">Plantilla para stories</h2>
  <p style="color:var(--dim);margin:0 0 16px;font-size:.95rem">Elige una frase, escribe tu respuesta y descarga la imagen. Súbela a tu story y etiqueta a @${esc(CONFIG.social.handle)}.</p>
  <label class="lb" for="stPrompt">Frase</label>
  <select id="stPrompt">${STORY_PROMPTS.map((p,i)=>`<option value="${i}">${esc(p)}</option>`).join("")}</select>
  <label class="lb" for="stText">Tu respuesta (máx. 140 letras)</label>
  <textarea class="fld" id="stText" rows="3" maxlength="140" placeholder="Escribe aquí…"></textarea>
  <label class="lb" for="stName">Tu nombre (opcional)</label>
  <input type="text" id="stName" maxlength="30" placeholder="Si quieres que aparezca" style="margin-bottom:12px">
  <label class="lb">Color</label>
  <div class="tpl-row" id="stTpl">
    <div class="tpl on" data-i="0" style="background:#DE5D48"></div>
    <div class="tpl" data-i="1" style="background:#0F1830"></div>
    <div class="tpl" data-i="2" style="background:#F6EFE3"></div>
  </div>
  <canvas id="stCanvas" width="1080" height="1920" style="width:100%;max-width:300px;display:block;margin:0 auto 16px;border-radius:14px;border:1px solid var(--line)"></canvas>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn" id="stDl" style="flex:1">Descargar imagen</button>
    <button class="btn turq" id="stShare" style="flex:1">Compartir</button>
  </div>
  <p id="stMsg" style="margin:12px 0 0;font-size:.9rem;color:var(--dim)" hidden></p>
  <button class="btn ghost sm" style="margin-top:14px;width:100%" onclick="location.hash='compartir'">Copiar texto y hashtags para mi publicación</button>
</div>
${footer()}`;

  const cv = document.getElementById("stCanvas");
  let tpl = 0;
  const state = () => ({ tpl, prompt: STORY_PROMPTS[+document.getElementById("stPrompt").value], text: document.getElementById("stText").value, name: document.getElementById("stName").value.trim() });
  const redraw = () => drawStory(cv, state());
  const init = async () => {
    try { await Promise.all([document.fonts.load("800 60px 'Bricolage Grotesque'"), document.fonts.load("700 30px 'Atkinson Hyperlegible'")]); } catch (e) {}
    if (!storyLogo) {
      storyLogo = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = "logo.png"; });
    }
    redraw();
  };
  ["stPrompt", "stText", "stName"].forEach(id => document.getElementById(id).addEventListener("input", redraw));
  document.querySelectorAll("#stTpl .tpl").forEach(el => el.onclick = () => {
    tpl = +el.dataset.i;
    document.querySelectorAll("#stTpl .tpl").forEach(x => x.classList.toggle("on", x === el));
    redraw();
  });
  redraw(); init();

  const msg = (m) => { const e = document.getElementById("stMsg"); e.textContent = m; e.hidden = false; };
  const getBlob = () => new Promise(res => cv.toBlob(res, "image/png"));
  document.getElementById("stDl").onclick = async () => {
    try {
      const b = await getBlob();
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "story-shadowban.png"; a.click();
      msg("Imagen descargada. Ábrela desde tu galería y súbela a tu story.");
    } catch (e) { msg("No se pudo crear la imagen. Prueba abriendo la página desde el enlace del taller."); }
  };
  document.getElementById("stShare").onclick = async () => {
    try {
      const b = await getBlob();
      const f = new File([b], "story-shadowban.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f], text: "@" + CONFIG.social.handle + " " + CONFIG.social.hashtags });
      } else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "story-shadowban.png"; a.click();
        msg("Tu navegador no permite compartir directo; descargué la imagen para que la subas tú.");
      }
    } catch (e) { if (e && e.name !== "AbortError") msg("No se pudo compartir. Usa “Descargar imagen”."); }
  };
}

// ═══════════════════════════════════════════════════════════════
//  Boot — muestra la interfaz INMEDIATAMENTE, Firebase carga de fondo
// ═══════════════════════════════════════════════════════════════
// Show UI right away — no waiting for Firebase
route();

// Si el taller cambió de sesión (otra fecha), pide registrarse de nuevo
async function syncSession() {
  if (!firebaseReady || !participantId || participantId.indexOf("local_") === 0) return;
  try {
    const cs = await fdb.doc("config/settings").get();
    const active = (cs.exists && cs.data().activeSessionId) || "-";
    if (participantSid !== active) {
      participantId = null; participantName = ""; participantSid = null;
      try { localStorage.removeItem("sb_pid"); localStorage.removeItem("sb_pname"); localStorage.removeItem("sb_sid"); } catch (e) {}
    }
  } catch (e) {}
}

// Load Firebase in background
initFirebase().then(async ok => {
  if (!ok && CONFIG.firebase.apiKey) console.error("Firebase failed to initialize");
  if (ok) { await syncSession(); route(); }
});
</script>
